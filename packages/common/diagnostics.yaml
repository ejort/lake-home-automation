sensor:
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi Signal RSSI
    id: wifi_signal_db
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    id: wifi_signal_pct
    name: WiFi Signal %
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome Version
    hide_timestamp: true

  - platform: wifi_info
    ip_address:
      name: IP Address
      id: host_ip
      entity_category: diagnostic
      icon: mdi:router-wireless

button:
  - platform: restart
    name: Restart ${friendly_name}
    entity_category: config

substitutions:
  # Fallback AP SSID. Override in the device file when the friendly name
  # would push "${friendly_name}" past the 32-character limit.
  ap_ssid: ${friendly_name}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  wifi: !include wifi.yaml
  diagnostics: !include diagnostics.yaml

web_server:
  include_internal: false
  version: 3

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: my_ota
    password: !secret ota_password

logger:
  level: INFO

preferences:
  flash_write_interval: 10min

time:
  - platform: homeassistant
    id: ha_time
    timezone: Australia/Melbourne

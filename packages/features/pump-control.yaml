# House transfer-pump contactor relay. Do not include together with valve-control.
# GPIO16, active-high, restore off. Entity id pump_relay, name "Pump Relay".
# A board still running the older firmware publishes this as valve_relay /
# "Valve Relay"; the panel link uses the pump_relay id, so that board must be reflashed.
# There is no contactor auxiliary or flow proof; relay state is not pump-running confirmation.
# Panel run requests arrive through the node's communications package, not here.

switch:
  - platform: gpio
    id: pump_relay
    name: Pump Relay
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: GPIO16
      mode: OUTPUT
